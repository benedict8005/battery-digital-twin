[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-pinn"
version = "0.1.0"
description = "Physics-informed neural network digital twin for lithium-ion battery temperature and SEI stability"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch",
    "deepxde",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pandas-stubs", "scipy-stubs"]

[project.scripts]
battery-pinn = "battery_pinn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "test"]

[tool.ruff.lint]
# Permissive start (task #3): pyflakes, pycodestyle and import order only.
select = ["E", "F", "W", "I"]
# E501 is left to `ruff format` (added in a later step of task #3).
ignore = ["E501"]
# `I` is the symbol for current in the physics code.
per-file-ignores = { "src/battery_pinn/physics.py" = ["E741"], "test/*" = ["E402", "E741"] }

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

# Modules already clean under --strict; extend this list as each module is typed.
[[tool.mypy.overrides]]
module = ["battery_pinn.config", "battery_pinn.ocv", "battery_pinn.interpolation", "battery_pinn.device", "battery_pinn.data", "battery_pinn.nasa_mat", "battery_pinn.etl"]
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = false
warn_return_any = true
no_implicit_reexport = true
